# Costruisce il programma desktop (installer e zip) su macchine Windows/macOS/Linux vere
# e, se richiesto, lo pubblica in una Release di GitHub.
#
# Avvio manuale: scheda «Actions» → «Programma desktop» → «Run workflow».
#   - lascia «release_tag» vuoto per ottenere i file solo come «Artifacts» (scadono dopo 90 giorni);
#   - scrivi un nome (es. v1.0.0) per creare anche la Release con i file scaricabili da chiunque abbia accesso al repository.
# Un tag che inizia per «v» (git push origin v1.0.0) fa la stessa cosa in automatico.
name: Programma desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nome della release da creare (es. v1.0.0). Vuoto = solo artifacts.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            flags: -c.win.signAndEditExecutable=true
          - os: macos-latest
            script: dist:mac
            flags: ''
          - os: ubuntu-latest
            script: dist:linux
            flags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Unit test
        run: npm test
      # su Windows l'icona e i metadati dell'eseguibile vengono applicati da rcedit (nativo: nessun wine)
      - name: Build
        shell: bash
        run: npm run ${{ matrix.script }} -- ${{ matrix.flags }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ciak-studio-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  # Un solo job pubblica la Release (le tre build in parallelo si pesterebbero i piedi creando lo stesso tag).
  release:
    needs: build
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          pattern: ciak-studio-*
          merge-multiple: true
      - run: ls -la pacchetti
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Ciak Studio ${{ inputs.release_tag || github.ref_name }}
          files: pacchetti/*
          fail_on_unmatched_files: true
          body: |
            **Ciak Studio** — editor video non lineare open source.

            ### Windows
            - **`Ciak-Studio-Installer-*-x64.exe`**: installer con menu Start e disinstallatore.
            - **`Ciak-Studio-*-Windows-x64.zip`**: versione portatile. Estrai tutto in una cartella e avvia `Ciak Studio.exe`.

            Alla prima apertura Windows può mostrare «Windows ha protetto il PC» perché il programma non è firmato con un
            certificato a pagamento: clicca **Ulteriori informazioni → Esegui comunque**.

            ### Altri sistemi
            Pacchetti macOS (non firmato: clic destro → Apri) e Linux (AppImage). Non sono stati provati su macchine reali.

            ### Licenze
            Il codice è MIT. I pacchetti includono Electron/Chromium e **ffmpeg (GPLv3)** — licenza in `resources/ffmpeg/LICENSE.txt`,
            sorgenti su https://ffmpeg.org e https://github.com/eugeneware/ffmpeg-static.
